# What this Prometheus scrapes, and it is deliberately three things.
#
# WHY A SECOND PROMETHEUS ON THIS MACHINE. There is already one here, in a stack
# that is not ours. Sharing it would put F2's acceptance criterion in somebody
# else's configuration file: "an artificial log trips the limit instead of
# filling the disk" tests nothing unless the limit is ours to set and ours to
# break. ADR 0027 §2 states the same rule for memory limits — a limit we assert
# has to be enforced by us. ADR 0039 §1.
#
# WHAT F3 CONNECTED. The paragraph that stood here listed Traefik, node-exporter
# and postgres-exporter as deferrals; all three are below now, and so is
# rule_files. F2 laid the pipe, the first three jobs proved it carried
# something, and the next three are what the site's numbers are actually made
# of: Metrics.p95Ms, Metrics.errorRate and Metrics.uptime90d in the contract all
# resolve, through F5's snapshots, to a recording rule over traefik_service_*.
#
# WHY TRAEFIK IS REACHABLE AT ALL, because the obvious reading of the job below
# is wrong. Traefik does not live on a network of ours; it lives in
# dokploy-network, shared with every app on this host, and check-compose rule 1
# and 11 keep prometheus, loki, alloy and db out of there on purpose (ADR 0039
# §2). Nothing here joined that network. Traefik joined OURS -- the same
# direction the neighbouring Grafana was wired in, reversed -- and it answers to
# an alias we own rather than to `traefik`, which on a shared network is a name
# anybody may already hold. ADR 0040 §1.
#
# NO --web.enable-lifecycle IN THE COMMAND either: this service carries no
# authentication — its protection is the network boundary and nothing else
# (handbook ch. 29, ADR 0028 §6) — and a reload endpoint on an unauthenticated
# service is a lever for anything that reaches the network.
#
# The retention flags are NOT in this file. --storage.tsdb.retention.time and
# .size are command-line only, so they live in compose.yaml next to the memory
# limit they belong with. That is the one place where Prometheus can do what
# Loki cannot: bound its own disk by size. ADR 0039 §4.

# THE RULES ARE A FILE AND NOT A LINE, and the directory is mounted read-only
# like this one. Their names are a contract with F5: it queries them by name over
# the tunnel and writes the answers into metric_snapshots, so renaming one later
# costs two phases. ops/prometheus/rules/slis.yml says which contract field hangs
# on which rule. ADR 0040 §4.
rule_files:
  - /etc/prometheus/rules/*.yml

global:
  # 15s is Prometheus's own default and the interval every histogram_quantile
  # example assumes. It is also cheap here: six targets, seven days, and a
  # 2 GB ceiling that this volume will not come close to.
  #
  # It is the SAME 15s that makes the [5m] windows in ops/prometheus/rules/
  # honest: twenty samples per window, so a p95 there is a quantile over
  # measurements rather than over two points and a hope.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # WHO ACTUALLY SEES THIS, because the two readers named here first were both
    # wrong and both were measured wrong.
    #
    # external_labels are attached only to data that LEAVES this server --
    # federation, remote_write, and the alerts Alertmanager sends. A query
    # answered locally never carries them. Measured twice: a Grafana datasource
    # asking `up{stack="timseil"}` gets an empty result (2026-08-24), and so
    # does the F5 snapshot loop, which reaches this instance over the compose
    # network and is just as local (2026-08-26). Neither the datasource nor the
    # snapshot can tell which Prometheus answered it from this label, and the
    # earlier version of this comment claimed both.
    #
    # It stays because it has a real reader, just a later one: F10's alerts
    # carry it out of this process, and an alert that cannot say which stack it
    # is about is a page nobody can act on. docs/runbooks/observability.md has
    # the two measurements; the alias on the service is what actually keeps the
    # neighbouring Prometheus apart from ours.
    stack: timseil

scrape_configs:
  # Itself. The first question after "did the scrape work" is "did the scraper
  # work", and prometheus_tsdb_* is also how the size ceiling below gets watched
  # once F10 hangs an alert on it.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The collector. alloy_* carries what the log pipeline did — lines forwarded,
  # bytes dropped, targets discovered — which is the half of F2 that Loki cannot
  # answer: Loki knows what arrived, only Alloy knows what it decided not to
  # send. The port is Alloy's HTTP listener, set explicitly in compose.yaml
  # because its default binds to loopback and nothing would reach it.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # The log store. loki_discarded_samples_total is the counter F2's acceptance
  # criterion reads: when the flood runs, this is where "the limit tripped"
  # becomes a number instead of the absence of a full disk.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # ------------------------------------------------------------------- F3
  #
  # The proxy, and it is the only source on this list the site quotes directly.
  # Every request to timseil.dev passes through it, so it is the one place that
  # can answer "how long did a visitor wait" for api and web with one clock.
  # The contract says so in as many words: Metrics.p95Ms is "95th percentile
  # latency, measured at the reverse proxy".
  #
  # timseil-traefik, not traefik. The alias is set where Traefik is attached to
  # observability-network -- compose.lab.yaml does it for the lab, Dokploy does
  # it for the host (runbook dokploy.md 3.2). A bare `traefik` would be a name
  # on a shared network that resolves to whoever holds it, and the failure mode
  # is not an empty job: it is a full one describing somebody else's proxy.
  # The same trap ADR 0039 2 caught for `prometheus`.
  #
  # 8082 is Traefik's own metrics entrypoint, never `web` or `websecure`: on a
  # request entrypoint the path is public as soon as a router matches it.
  # ADR 0028 6.
  - job_name: traefik
    static_configs:
      - targets: ["timseil-traefik:8082"]

  # The host. node_filesystem_avail_bytes on / is the series F10 hangs the
  # 70 % disk alert on, and that alert is the honest guard ops/loki/loki.yaml
  # names for the threat no Loki setting closes -- Loki and Postgres share this
  # NVMe. Scraping it in F3 rather than in F10 means the alert arrives with
  # history behind it instead of with an empty graph.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The database. Connections against the pool ceiling, transaction age, dead
  # tuples -- the questions "is the site slow" resolves to once the proxy has
  # said yes. It reads pg_stat_* as timseil_metrics, a third role that is
  # neither the DDL one nor the DML one. ADR 0040 3.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

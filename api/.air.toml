# Hot reload for `make dev`. Development only — the production image (D1)
# builds once, statically, and never watches anything.

root = "."
tmp_dir = "tmp"

[build]
  # CGO off here for the same reason as in D1: nothing in this service needs
  # it, and the dev container carries no C toolchain.
  cmd = "CGO_ENABLED=0 go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  # Editors write in bursts. Without a delay one save triggers two builds.
  delay = 300
  # A build error must leave the last good binary running and say so, not
  # restart into a half-written state.
  stop_on_error = true

  # Without these two, air kills the server outright — on every rebuild and on
  # `docker compose stop`, because air is PID 1 in this container and the
  # signal never reaches the binary. The graceful shutdown of C1 would then be
  # code that only ever runs in production, which is another way of saying
  # untested. With send_interrupt the process gets a signal it handles, drains,
  # and says so in the log; kill_delay is the ceiling on that patience and sits
  # above SHUTDOWN_GRACE so air is not the one cutting the drain short.
  send_interrupt = true
  kill_delay = "25s"

[log]
  time = true

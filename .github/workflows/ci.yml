# The gates that already existed, run by something other than a person
# remembering to run them.
#
# Every check here is an existing `make` target. This file adds no new rule and
# no second definition of an old one: what a developer runs before pushing and
# what blocks a merge are the same commands, and that is the point. A pipeline
# that reimplements its checks in YAML has two of everything, and the two drift.
#
# Three jobs, deliberately parallel rather than sequential. The build plan's
# acceptance for E1 is "PR feedback under 5 minutes", and feedback time is the
# SLOWEST job, not the sum of all of them. `check` needs no Docker at all; `db`
# and `images` each pay for a container build, and paying for both inside one
# job is what would break the criterion.
#
# E2 added the scanners. E3 added `publish`: the first push to GHCR that no
# person performs — the bridge off a laptop that D3 needed is gone, and the
# first half of #90 with it — and then the signature, the SBOM attestation and
# the SLSA provenance that make a published image traceable back to this file.
# E4 added `deploy`, and with it the last handgriff: nobody types a tag into a
# panel any more, and a release that does not answer within sixty seconds rolls
# itself back. See ADR 0030 for the three original jobs, ADR 0031 for what E2
# hung off them and ADR 0033 for why the deploy goes through an ssh tunnel.
#
# Where each check lives follows one rule (ADR 0031): a deterministic gate that
# needs no container is part of `make check` and runs inside the `check` job; a
# gate that needs a container, or that can turn red on a tree nobody touched,
# is its own make target and its own job. Nothing here reimplements a check in
# YAML — every step below is a `make` target a person can run.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The scanners read somebody else's disclosure schedule, so they have to run
  # without a pull request to run on: a CVE published on a quiet week would
  # otherwise be found by the next person who happened to open one.
  #
  # 04:17 on Monday, and not on the hour: GitHub's cron queue is longest at
  # :00, and a scheduled job that starts forty minutes late is a job whose
  # timing nobody can reason about. Only `scan` and `codeql` take this trigger.
  schedule:
    - cron: "17 4 * * 1"

# Explicit in every workflow, default read — CLAUDE.md, security rules. This is
# the ceiling for every job that does not say otherwise, and exactly two do:
#
#   codeql    security-events: write, because uploading its results is the only
#             thing it does, plus actions: read to see the workflow it ran in
#   publish   packages: write to push, id-token: write so cosign can ask who is
#             running, attestations: write for the provenance
#
# Both run where their extra reach is the entire product, and neither grants it
# to anything else. `publish` in particular never runs on a pull request, so no
# branch under review is ever handled by a job that can sign in this project's
# name.
#
# That is also why Trivy, gitleaks and govulncheck block on an exit code
# instead of uploading SARIF. A nicer Security tab is not worth handing three
# more jobs a token that can write to this repository's security data.
permissions:
  contents: read

# A second push to a pull request makes the first run irrelevant, so it is
# cancelled. A run on main is not cancelled even if another lands behind it:
# there, each run is the evidence for exactly one commit on the branch the
# deploy follows, and evidence that was cancelled proves nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit SHA, never to a tag. A tag can be
# moved to point at other code after review, which is exactly how the
# tj-actions/changed-files compromise reached its consumers. The trailing
# comment carries the human-readable version, because a bare hash is unreadable
# six months later and an unreadable pin never gets bumped.
#
# Every additional action is another repository whose maintainers can push to
# this pipeline, so E2 added as few as it could: golangci-lint-action to place
# a binary, trivy-action to scan an image, and codeql-action because CodeQL has
# no other entry point. gitleaks runs from a digest-pinned image and
# govulncheck from `go run`, both without an action at all — the tool that
# scans the supply chain should not widen it.

jobs:
  # ------------------------------------------------------------------ check
  #
  # `make check` in full, on a runner with Node and Go. No Docker: not one
  # target in the check chain starts a container, which is why this job is the
  # fast one and why it is the one worth optimising.
  check:
    name: check
    runs-on: ubuntu-latest
    # The weekly trigger is for the scanners; this job answers a diff.
    if: github.event_name != 'schedule'

    env:
      # CI runs the test suite with the Go test cache OFF. Issue #91, and it is
      # a bug that already happened rather than a precaution:
      # TestCommandsDoReachTheSeed shells out to `go list`, and Go's test cache
      # records the files and environment a test package reads — it cannot see
      # what a SUBPROCESS touches. The test kept returning a cached pass while
      # `make check-db` went red on the same tree. `make check` was green and
      # the repository was not.
      #
      # Locally the cache stays on: it is what makes `make check` fast enough to
      # run constantly, and that is worth keeping. The pipeline is the place
      # that can afford to be slow and correct.
      #
      # This does not defeat the module and build caching below — the build
      # cache and the test cache are different things, and only the second one
      # is being refused.
      GOFLAGS: -count=1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tools/check-repo.sh asserts core.hooksPath is .githooks, because a fresh
      # clone leaves it unset and then the local half of the gates never fires
      # and nobody notices. A fresh CI checkout is a fresh clone, so without
      # this line `make check` fails on its own hook assertion before it has
      # checked a single file.
      #
      # The runner does here exactly what CONTRIBUTING.md tells a person to do
      # after cloning. Teaching the script to skip itself under CI would have
      # been the other option and is the wrong one: it puts an exception into a
      # gate that tools/selftest.sh holds against its own broken case.
      - name: Point git at the repository hooks
        run: git config core.hooksPath .githooks

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The version is read from go.mod rather than typed here. A second
          # spelling of the same number is a second number, and stack.yaml makes
          # the same argument about every version on the site.
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same argument, and there is a second one here: tools/check-node.sh
          # compares the RUNNING node major against .nvmrc. Reading the same
          # file makes that check meaningful instead of circular — and without
          # any node at all the script skips itself with exit 0, so a job
          # missing this step would go green having checked nothing.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # make check-contract runs `make gen`, and gen needs redocly and
      # openapi-typescript out of web/node_modules — it calls them with
      # `npx --no-install`, which does not fetch anything. Without this step the
      # contract check reports "redocly is not installed" and stops.
      #
      # The Go half of gen (oapi-codegen, sqlc) comes from the tool directives
      # in api/go.mod and needs no separate install.
      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # install-only, and that word is the whole design. The action places the
      # binary and stops; `make check` runs it through tools/check-lint.sh with
      # the repository's config. A separate lint job driven by the action would
      # be a second definition of the same gate in YAML, and the two would
      # drift — the objection ADR 0030 raises against reimplementing checks in
      # a pipeline.
      #
      # version-file rather than a version: .golangci-lint-version is the one
      # place the number is written, and check-lint.sh holds the installed
      # binary against the same file. Same argument as go-version-file above.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
          version-file: .golangci-lint-version

      # check-tools check-node check-repo check-todo check-compose
      # check-dockerfiles check-migrations check-stack check-go check-lint
      # check-web check-contract — the same list, in the same order, as on a
      # laptop. check-lint refuses to skip when CI is set, so a job that lost
      # the step above goes red instead of green.
      - name: make check
        run: make check

  # --------------------------------------------------------------------- db
  #
  # The migration cycle and the schema invariants against a real Postgres.
  # Issue #30.
  db:
    name: db
    runs-on: ubuntu-latest
    # The weekly trigger is for the scanners; this job answers a diff.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No secret values are needed here and none are added: `make check-db`
      # starts only the db service, and the two throwaway DSNs it uses are in
      # the example file already. Compose refuses to interpolate without them
      # and says so, which is why the file is copied rather than skipped.
      - name: Provide the development environment file
        run: cp .env.example .env

      # Deliberately NOT a `services: postgres:` block.
      #
      # make check-db starts db from compose.dev.yaml and runs the tagged tests
      # INSIDE the migrate container (`-tags=db -count=1 -p 1`). That is the
      # path that is exercised locally, and it is the only one that works
      # unmodified: TEST_DATABASE_URL names the host `db`, which resolves in the
      # compose network and nowhere else. An Actions service container would
      # need its own DSNs — a second, untested way into the same database, kept
      # in step with the first one by nothing.
      #
      # The price is a container build plus empty go-mod-cache and
      # go-build-cache volumes on every run. That price is why this is its own
      # job instead of a step in `check`. ADR 0030.
      - name: make check-db
        run: make check-db

  # ----------------------------------------------------------------- images
  #
  # The acceptance criteria of D1, D2 and D3, which have been manual steps
  # stated in a PR body until now. Issue #92.
  #
  # Checkout stays at the default depth, and that is now a cost decision rather
  # than a necessity. IMAGE_TAG comes from `git rev-parse --short=7 HEAD`, which
  # needs no history, and VERSION from tools/version.sh, which matches only v*
  # tags — so a tag that is not a release cannot name a version here or anywhere.
  #
  # The reason written here before was wrong and worth recording as such: it
  # claimed that fetching tags would describe against
  # backup/pre-rewrite-2026-08-17. That tag exists only on a developer machine —
  # this repository has no tags at all on GitHub — so CI could never have seen
  # it. The wrong version in production came from an image built locally during
  # D3's manual deploy, not from this job. Issue #112.
  #
  # **E5 has to revisit this.** Once release-please starts tagging, VERSION here
  # will still answer the short sha unless the job fetches tags, which is
  # correct but less than it could say.
  #
  # On a pull_request the checked-out commit is the merge result, so what gets
  # built and measured is what would land, not the branch tip in isolation.
  # Pull requests only. On a push to main the same work happens inside
  # `publish`, which then signs what it just checked — see the long comment
  # there for why the two are one job per event rather than two jobs in a row.
  images:
    name: images
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-topology runs the PRODUCTION compose file, so it starts the real
      # api binary, and that binary refuses to start on an incomplete
      # environment — by design, from C1. Three values in .env.example are
      # deliberately empty because the file is committed, and all three are
      # required and must be at least 32 characters:
      # CONTACT_IP_PEPPER, INTERNAL_PROBE_TOKEN, INTERNAL_DEPLOY_TOKEN.
      #
      # Generated per run and thrown away with the runner. They authenticate
      # nothing outside this job: the containers they are handed are torn down
      # by check-topology itself, and no port of that stack is reachable from
      # anywhere.
      #
      # GITHUB_TOKEN stays empty and no token is needed — the Makefile's
      # TOPOLOGY_ENV sets CONTRIBUTIONS_TRANSPORT=off, which switches the
      # refresher off rather than the start. That is the answer to the problem
      # recorded against #56.
      - name: Provide the production environment file
        run: |
          cp .env.example .env
          make env-dev

      # Local tags only, and on a pull request that is where they stay: nothing
      # a branch built gets published. `make push` exists and is called in
      # `publish`, never here and never on the VPS.
      - name: make images
        run: make images

      # D1: the api image under 20 MiB, both images non-root, no shell in the
      # api image, .next/static and public present in the web image.
      - name: make check-images
        run: make check-images

      # D2 and D3, and the only check that actually runs the start-up order:
      # from an empty volume, twice, 2/22/13 seeded rows, limits and
      # ReadonlyRootfs read off the running containers, db publishing no port,
      # both networks measured, and a deliberately broken migration that must
      # leave the api never started.
      #
      # It creates its own stand-in for dokploy-network (`require-network`) and
      # tears its stack down again, so it needs nothing from the runner but
      # Docker.
      - name: make check-topology
        run: make check-topology

      # The tag comes from the Makefile that produced it. Spelling
      # `sha-$(git rev-parse --short=7 HEAD)` again here would be a second
      # definition of the same name, and the way that fails is quiet: Trivy
      # scans an image that does not exist and reports nothing wrong with it.
      - name: The tag make images just used
        id: tag
        run: printf 'value=%s\n' "$(make -s image-tag)" >> "$GITHUB_OUTPUT"

      # The images exist by now, so this is the cheapest place to scan them:
      # anywhere else would build them a second time.
      #
      # ignore-unfixed is the build plan's wording, not a convenience — chapter
      # 5.2 blocks on "bekannte Schwachstelle MIT Fix". A finding with no fix
      # available is not an action, it is a permanent red, and a permanently
      # red gate gets switched off. It comes back the moment upstream ships
      # something, which is what the weekly `scan` run is for.
      #
      # exit-code 1 rather than a SARIF upload: blocking here keeps this job at
      # contents: read.
      - name: Trivy — api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: timseil-api:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy — web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: timseil-web:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ---------------------------------------------------------------- publish
  #
  # The same six steps as `images`, and then the three that publish. Only one of
  # the two jobs runs per event: `images` answers a pull request, `publish`
  # answers a push to main.
  #
  # **Why not `needs: images`.** A publishing job that depended on the checking
  # job would have to build the images a second time — nothing carries a 200 MB
  # image between jobs for free — and then the artefact that gets pushed and
  # signed is NOT the artefact that check-images, check-topology and Trivy
  # looked at. ADR 0026's whole claim is that what was tested is what runs, and
  # E3 is the phase that is supposed to make that claim checkable by a stranger.
  # Breaking it here to save six lines of YAML would be an odd trade.
  #
  # The duplication is the price and it is a small one: after a squash merge the
  # commit on main is not the merge result the pull request built, so the image
  # has to be built again in any design. This one at least builds it once.
  #
  # Branch protection (#29) keeps `images` as the required context; `publish`
  # runs where there is nothing left to block.
  #
  # Four permissions above the file default and not one more. `packages: write`
  # to push; `id-token: write` so cosign can ask Actions who is running, which
  # is the whole of keyless signing; `attestations: write` for the provenance.
  # All three live on this job and on no other — E2's rule, kept literally.
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same three generated values as in `images`, same reason: check-topology
      # runs the real api binary, and it refuses to start on an incomplete
      # environment. They are thrown away with the runner and authenticate
      # nothing outside this job.
      - name: Provide the production environment file
        run: |
          cp .env.example .env
          make env-dev

      - name: make images
        run: make images

      - name: make check-images
        run: make check-images

      - name: make check-topology
        run: make check-topology

      - name: The tag make images just used
        id: tag
        run: printf 'value=%s\n' "$(make -s image-tag)" >> "$GITHUB_OUTPUT"

      # Nothing is pushed before the scanners have seen it. The order in this
      # job is the whole argument: build, check, scan, and only then publish.
      - name: Trivy — api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: timseil-api:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy — web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: timseil-web:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # No docker/login-action. It would be one more repository whose
      # maintainers can push code into this pipeline, for two lines that the
      # CLI already has — the same accounting E2 applied when it took gitleaks
      # from a pinned image instead of an action.
      #
      # GITHUB_TOKEN, not a personal access token. It expires with the job and
      # it can only reach packages this repository has been given write access
      # to, which is the difference between the pipeline pushing and a person
      # pushing from a laptop.
      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: make push
        run: make push

      # After the push, because the SBOM belongs to an image that exists
      # somewhere other than this runner. `make sign` turns these two documents
      # into attestations on the digests that `make push` just printed.
      - name: make sbom
        run: make sbom

      # Keyless. No key exists anywhere in this repository, on this runner or on
      # the VPS — cosign asks Actions for an OIDC token, Fulcio issues a
      # certificate good for ten minutes, and Rekor records it. What a verifier
      # later checks is the IDENTITY in that certificate, which is this file on
      # this branch. tools/sign.sh carries the reasoning.
      - name: make sign
        run: make sign

      # The two digests, read from the images that were just pushed rather than
      # spelled again here. `make image-digest-*` refuses to answer for an image
      # that has no digest, so a subject that does not exist fails loudly
      # instead of attesting a name.
      - name: The digests make push just published
        id: digests
        run: |
          printf 'api=%s\n' "$(make -s image-digest-api)" >> "$GITHUB_OUTPUT"
          printf 'web=%s\n' "$(make -s image-digest-web)" >> "$GITHUB_OUTPUT"

      # SLSA provenance, from GitHub's own attestation rather than from cosign.
      # The build plan names it, and it is the half a reader can check with
      # `gh attestation verify` without knowing anything about Sigstore.
      #
      # push-to-registry, so the statement lands next to the image instead of
      # only in GitHub's API: the artefact should carry its own evidence, and an
      # evidence store that lives somewhere else is a second thing that has to
      # survive.
      - name: Provenance — api image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/g1ng4r/timseil-api
          subject-digest: ${{ steps.digests.outputs.api }}
          push-to-registry: true

      - name: Provenance — web image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/g1ng4r/timseil-web
          subject-digest: ${{ steps.digests.outputs.web }}
          push-to-registry: true

      # Deliberately BEFORE the verification, not after the job.
      #
      # What E3 claims is that anybody can check this image. A verification that
      # runs with the runner still logged in to the registry demonstrates
      # something weaker and looks identical in the log. So the credentials go
      # away first, and what follows is the same command a stranger would run.
      - name: Log out of GHCR
        run: docker logout ghcr.io

      # The acceptance criterion of the phase, run on every merge rather than
      # demonstrated once in a pull request body. Includes its own broken case:
      # a deliberately wrong certificate identity that must fail.
      - name: make verify-supply-chain
        run: make verify-supply-chain
        env:
          GH_TOKEN: ${{ github.token }}

  # ------------------------------------------------------------------ deploy
  #
  # Steps six and seven. Until E4 this file stopped after five: it built, it
  # checked, it scanned, it pushed and it signed, and then a person read
  # `make image-tag`, typed the value into a field in the Dokploy panel and
  # pressed a button. That handgriff was the last place where "the artefact that
  # was tested is the artefact that runs" was held by discipline instead of by a
  # gate, and this job is what replaces it.
  #
  # HOW IT REACHES THE HOST. Through ssh, to the Dokploy API on 127.0.0.1. The
  # panel has no Traefik router and its port is closed — build plan L3, system
  # handbook chapter 27 — so the pipeline goes through the same door a person
  # goes through, and L3 has nothing to tear down later. The key it uses can
  # open that one forward and execute no command; the authorized_keys line and
  # its counter-test are in docs/runbooks/dokploy.md.
  #
  # WHY DOKPLOY AND NOT `docker compose` OVER SSH. Dokploy owns the environment
  # and writes the .env that compose interpolates IMAGE_TAG from. Running
  # compose directly would leave the panel saying something else, and the next
  # person to press Deploy there would perform a silent rollback. ADR 0033.
  #
  # WHAT IT MAY DO. contents: read to check out, actions: read to ask when this
  # run started. Not packages, not id-token, not attestations — this job cannot
  # push an image and cannot sign one. `publish` can do those and cannot deploy.
  #
  # The whole of the job is one make target, and that is the rule this file has
  # followed since E1: nothing in YAML that is not a command a person can run.
  # tools/deploy-gate.sh carries the deploy, the sixty-second verify, the
  # rollback and the report — and the drill in the runbook runs the same file.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: publish
    # vars.DEPLOY_ENABLED is the arming switch, and it exists because this
    # pipeline landed before the last measurement did.
    #
    # tools/deploy.sh talks to Dokploy over five values that were taken from
    # documentation and never read off the running panel. Everything else in
    # this phase — the verify gate, the rollback, the report — was exercised end
    # to end against a stand-in and is ready. Holding all of it back for one
    # unread config line would be the wrong trade; shipping it armed, and
    # letting the first merge discover the line, would be the other wrong one.
    #
    # A skipped job is the honest rendering of "not armed yet": Actions shows it
    # grey, not green. The alternative — run, notice the secret is missing, exit
    # 0 with an explanation — would paint a green tick over a deploy that did
    # not happen, which is the same comfortable lie this job refuses to tell
    # about a rollback.
    #
    # To arm:  gh variable set DEPLOY_ENABLED --body true
    # docs/runbooks/github.md says what has to be true first.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'

    permissions:
      contents: read
      actions: read

    # Two merges landing minutes apart must not deploy at the same time: they
    # would race over one IMAGE_TAG and the loser's rollback target would be the
    # winner's build. cancel-in-progress is false because a deploy interrupted
    # halfway is worse than a deploy that waits — the workflow-level group makes
    # the same choice for runs on main, for the same reason.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # StrictHostKeyChecking=yes against a pinned known_hosts, so an unexpected
      # host key is an abort rather than a question. ExitOnForwardFailure=yes,
      # because ssh will otherwise sit there happily with no forward and let the
      # deploy fail one step later against a connection refused on localhost —
      # a message about the wrong thing entirely.
      #
      # The key is written with install -m 600 rather than by redirecting into a
      # file that exists for an instant at the default mode.
      - name: Open the tunnel to Dokploy
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          # A secret rather than a literal, and not because a port number is
          # confidential — it plainly is not. This repository is public, and
          # writing the real port here would spend the small amount that moving
          # it off 22 buys, for nothing. No default either: a fallback to 22
          # would turn a missing secret into a connection timeout instead of a
          # sentence naming the missing secret.
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          : "${VPS_SSH_PORT:?VPS_SSH_PORT is not set — docs/runbooks/github.md}"
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/ci-deploy
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ci-deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -f -N \
            -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/ci-deploy \
            -L 3000:127.0.0.1:3000 \
            "$VPS_SSH_USER@$VPS_SSH_HOST"

      # The instant the RUN began, not the instant this job began.
      #
      # `check`, `db` and `publish` have already spent their minutes by the time
      # this step runs, and those minutes are part of what the case study means
      # by BUILD + DEPLOY. Measuring from here would publish a number that is
      # correct about the wrong interval. Read from the Actions API rather than
      # from a clock this workflow started itself.
      - name: When this run began
        id: began
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --jq .run_started_at)
          printf 'epoch=%s\n' "$(date -u -d "$started" +%s)" >> "$GITHUB_OUTPUT"

      # Deploy, verify against the public URL for sixty seconds, roll back to
      # the previous tag if it does not come up, and report the measured
      # duration to the site's own API either way. A rollback exits non-zero:
      # it worked, and the deploy still failed.
      #
      # DEPLOY_TAG and DEPLOY_SHA are left at their defaults, which follow HEAD
      # — the merge commit `publish` just built and signed. Spelling them here
      # would be a second definition of a name that already exists in one place.
      - name: make deploy-gate
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          INTERNAL_DEPLOY_TOKEN: ${{ secrets.INTERNAL_DEPLOY_TOKEN }}
        run: make deploy-gate DEPLOY_STARTED_AT=${{ steps.began.outputs.epoch }}

      # always(), because a runner that goes away with a forward still open is
      # a connection the host has to time out. Cheap here, tidy there.
      - name: Close the tunnel
        if: always()
        run: pkill -f 'ssh -f -N' || true

  # ------------------------------------------------------------------- scan
  #
  # The two scanners that read the world outside this repository: secrets that
  # were committed at some point, and vulnerabilities somebody disclosed since
  # the last run. Both are `make` targets — the same commands on a laptop.
  #
  # This job also carries the weekly trigger. `make check-vuln` can turn red on
  # a tree nobody touched, and a gate like that has to be able to fire without
  # waiting for the next pull request.
  scan:
    name: scan
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0, and ONLY here.
      #
      # gitleaks scans commits; with the default depth of 1 it would scan one
      # and report a clean history it never read.
      #
      # This used to add that the images job stays shallow to avoid describing
      # against backup/pre-rewrite-2026-08-17. That was wrong — the tag is
      # local to a developer machine and GitHub has no tags — and it is fixed
      # properly now: tools/version.sh matches only v* tags. Depth here is
      # about gitleaks needing commits, and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # npm audit reads package-lock.json and needs no node_modules, so there
      # is no `npm ci` here — the lockfile is the input.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The full history, plus the range this pull request adds. The second is a
      # subset of the first and runs anyway, because "a secret arrives in
      # <base>..HEAD" points a reviewer at their own commits instead of leaving
      # "somewhere in forty" as the answer.
      #
      # On push and on the schedule RANGE is empty and only the history scan
      # runs. base.sha is present because of fetch-depth: 0 above.
      - name: make check-secrets
        run: make check-secrets RANGE="${RANGE}"
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..HEAD', github.event.pull_request.base.sha) || '' }}

      - name: make check-vuln
        run: make check-vuln

      # E4's half of the same argument, pointed at the toolchain instead of at
      # the dependencies.
      #
      # Dependabot covers Dockerfiles, compose files, go.mod, package.json and
      # workflow files. It does not read a digest inside a shell script or a
      # version inside a text file, and four tools live in exactly those two
      # shapes — cosign, golangci-lint, gitleaks, syft. `make check` already
      # asserts they are pinned by full digest and carry a readable version;
      # this asks upstream whether any of them has moved, which is a question no
      # diff can answer and which goes red on a tree nobody touched.
      #
      # On the schedule only. On a pull request it would fail for a release that
      # landed this morning and has nothing to do with the change under review.
      - name: make check-pins-online
        if: github.event_name == 'schedule'
        run: make check-pins-online
        env:
          GH_TOKEN: ${{ github.token }}

      # E3's claim, re-asked once a week.
      #
      # Every other gate here answers a diff: it proves something about code on
      # its way in. This one asks whether something already published is still
      # what it was — a signature that verified at merge time and does not
      # verify today means the registry changed underneath it, and no build gate
      # can see that. It is the same argument the weekly govulncheck run makes,
      # pointed at the artefact instead of at the dependencies.
      #
      # **Only on the schedule.** `make image-tag` follows HEAD, so this step can
      # only ask its question about a commit that has already been published —
      # and on a push to main that is not yet true: `scan` and `publish` start
      # together, so `scan` would look for an image `publish` has not pushed
      # yet. That is what happened on c738b2a, and it is a race, not a finding:
      # MANIFEST_UNKNOWN for the very commit that was being published one job
      # over.
      #
      # A pull request is wrong for the same reason and one worse — that commit
      # is never published at all.
      #
      # `needs: publish` would have been the other repair and is the wrong one:
      # it puts the weekly re-verification on the critical path of every merge
      # to buy a check that `publish` already performs on itself, one step after
      # signing. Nothing is left unchecked by narrowing this — a merge is
      # covered by `publish`, and everything already in the registry is covered
      # here, seven days at a time.
      #
      # No docker login anywhere in this job, which is the point — this runs the
      # way a stranger's laptop runs it.
      - name: make verify-supply-chain
        if: github.event_name == 'schedule'
        run: make verify-supply-chain
        env:
          GH_TOKEN: ${{ github.token }}

  # ----------------------------------------------------------------- codeql
  #
  # The one job that needs more than contents: read, and the only one — writing
  # its results to the Security tab is the entire product. Everything else in
  # this file blocks on an exit code precisely so that it does not need this.
  #
  # It runs on pull requests for now. E1's acceptance is PR feedback under five
  # minutes and the three original jobs measured 2:27 wall clock; whether CodeQL
  # fits beside them is a question with a number, and the number goes in ADR
  # 0031 after the first run. If it does not fit, this job loses the
  # pull_request trigger and keeps push and schedule — a slower gate that still
  # blocks main, rather than a fast one that checks less.
  codeql:
    name: codeql
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      # One language failing should not hide the other's findings.
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Go analysis compiles the module, so it needs the toolchain the
      # module asks for rather than whatever the runner ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # security-and-quality over the default: this repository already runs
          # a strict linter, so the marginal cost is small and the marginal
          # finding is the interesting one.
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  # -------------------------------------------------------------- quickstart
  #
  # The half of documentation-drift check 3 that actually runs the thing. It
  # clones the repository the way the README tells a stranger to, follows the
  # block line by line, and fetches every URL the README promises underneath it.
  #
  # NOT on pull requests, and that is a decision rather than an oversight. It
  # needs npm ci, two image builds and a compose stack; on every PR it would
  # become the slowest job and therefore the feedback time, against E1's
  # criterion of five minutes (measured: 2:15 without it). And the question it
  # answers — "does the guide still work" — is one about months, not about the
  # diff in front of you.
  #
  # It clones from GitHub rather than using the checkout, on purpose: what is
  # under test is the experience of a person who has nothing but the README.
  # On a push to main the clone and the commit are the same thing.
  quickstart:
    name: quickstart
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The block runs `make check`, and check-lint refuses to skip when CI is
      # set — deliberately, so a job that lost this step goes red instead of
      # green. A reader installs the linter; so does the runner.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
          version-file: .golangci-lint-version

      # The same command a person can run. The driver reads the block out of
      # README.md through check-readme.sh --print, so there is no second copy of
      # the instructions anywhere.
      - name: make quickstart
        run: make quickstart

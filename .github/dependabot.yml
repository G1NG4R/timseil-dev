# Who raises the pins nobody else would.
#
# Three of this repository's rules create work that has no owner until this
# file exists, and each of them was written down as a cost at the time:
#
#   - Every FROM is a digest (ADR 0026, tools/check-dockerfiles.sh). A digest
#     never updates on its own, so a base image with a fixed CVE stays unfixed
#     until somebody lifts it by hand.
#   - Every action is a commit SHA (ADR 0030 §5). Same problem, and the reason
#     the pin is written with the readable version in a trailing comment.
#   - postgres is now a digest too (#93). It was the last movable tag in the
#     system and it moved for a reason; this is what moves it now.
#
# "Dependabot for Docker (E2) ist die Gegenmaßnahme, nicht Disziplin."
# — ADR 0026. This file is that sentence.
#
# ---------------------------------------------------------------------------
#
# THE DECISION #63 ASKED FOR: `allow: direct` on the two language ecosystems.
#
# api/go.mod carries 65 indirect lines and 41 of them belong to sqlc and
# oapi-codegen — build-time tools whose code never reaches the binary. Left on
# defaults, Dependabot would open pull requests for all of them, and the answer
# to drowning in individual PRs is never "switch Dependabot off later".
#
# Indirect dependencies still move: they move when a direct one moves and
# `go mod tidy` runs, which is the same path that keeps go.sum honest today.
# What is given up is the case where an indirect dependency has a CVE and no
# direct dependency has moved — and that case is covered by govulncheck in
# `make check-vuln`, which reads the whole graph and reports on reachability
# rather than on version numbers. The gap is named, not ignored.
#
# github-actions is NOT filtered: there is no such thing as an indirect action,
# and every one of them runs with a token.
#
# ---------------------------------------------------------------------------
#
# THE SECOND DECISION, and it cost two pull requests to learn: `allow` chooses
# WHICH dependencies, not WHICH KIND of update. The first wave after this file
# landed offered node 24 -> 26 and, separately, @types/node ^20 -> ^26,
# eslint ^9 -> ^10 and typescript ^5 -> ^7.
#
# Every one of those is a decision this repository has already made elsewhere
# and written down. CLAUDE.md refuses Node 26 until it is LTS (issue #46,
# 2026-10-28); @types/node has to track the Node major rather than npm's
# newest; and TypeScript 7 beside a freshly added typescript-eslint ^8 is a
# question, not a bump.
#
# So: **no major updates for npm, Docker or Go.** A major there changes what
# `.nvmrc`, `go.mod` and `stack.yaml` claim, and those claims are printed on a
# page. Raising one is a commit somebody argues for.
#
# github-actions keeps its majors. There the bump is usually mechanical, and it
# is the ecosystem whose whole point is that a pinned SHA gets no security
# update on its own (ADR 0030 §5) — ignoring majors there would re-create the
# problem this file exists to solve.
#
# ---------------------------------------------------------------------------
#
# THE THIRD DECISION, and it cost two pull requests as well: **major was the
# wrong notch.** #174 offered golang 1.26-alpine -> 1.27-alpine, #176 offered
# prom/prometheus v3.13.2 -> v3.14.0. Both are minors to Dependabot. Neither is
# a minor here:
#
#   - **Go's release line IS the minor.** `go.mod` decides which line the api is
#     built against and tools/check-versions.sh holds both Dockerfiles against
#     it, so an image bump on its own can never be green — #174 was red before
#     anyone read it. Raising the line moves go.mod, two Dockerfiles and
#     stack.gen.json in one commit somebody argues for.
#   - **Prometheus's LTS line IS the minor.** ADR 0007 pins `3.13.x`: a year of
#     bug, security and doc fixes, support until 2027-07-31, against a six-week
#     cycle that stops fixing a minor as soon as the next one starts. The choice
#     one makes for an operating system, not the highest number.
#
# So both get a second `ignore` line, and by NAME rather than by `*`. The name
# is the whole care taken here: a blanket semver-minor on docker-compose would
# also stop postgres 18.6 -> 18.7, and for postgres the minor IS the security
# release. loki and alloy stay open for the same reason in reverse — no ADR
# fixes a line for them, so no rule may pretend one exists.
#
# What still arrives: prom/prometheus 3.13.x patches, and digest refreshes of
# golang:1.26-alpine — the path ADR 0026 brought Dependabot in for. The cost is
# named: nothing will remind us that Go 1.27 exists. go.mod decides that, and
# go.mod is a file somebody reads.
#
# ---------------------------------------------------------------------------
#
# A RED DEPENDABOT PR IS NOT ALWAYS A REFUSAL, and #176 is the example. Versions
# are resolved at `make gen` time (ADR 0012) and check-contract compares the
# committed result against a fresh one. Dependabot cannot run `make gen`, so
# EVERY bump that moves a major.minor stack.yaml tracks — postgres, loki, alloy,
# next, react, pgx, sqlc, goose — lands red on api/internal/seed/stack.gen.json.
#
# That is a handle, not a reason for a third ignore: postgres 18.6 -> 18.7 is a
# bump we want. Written down here so the next red one costs a command instead of
# an investigation:
#
#     git fetch origin && git switch <dependabot-branch>
#     make gen && git add api/internal/seed/stack.gen.json
#     git commit && git push
#
# Dependabot stops rebasing a branch it did not write last. That is the trade,
# and it is worth it: a patch bump needs none of this, because stack.gen.json
# carries major.minor only — v3.13.2 -> v3.13.3 leaves "Prometheus 3.13" alone.

version: 2

updates:
  # --------------------------------------------------------------- go
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # -------------------------------------------------------------- npm
  #
  # Two groups rather than one, because the two carry different risk: a
  # production bump changes what ships to a browser, a dev bump changes what
  # builds it. They deserve to be reviewed apart.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-production:
        dependency-type: production
        patterns: ["*"]
      web-development:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: chore

  # ---------------------------------------------------- github actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # ------------------------------------------------------------ docker
  #
  # The four base image digests. One entry per Dockerfile, because the
  # ecosystem reads Dockerfiles and not the directory tree above them.
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # #174. The Go line is go.mod's call, and check-versions enforces it.
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor"]
    commit-message: { prefix: chore }

  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: chore }

  # ----------------------------------------------------- docker compose
  #
  # A SEPARATE ecosystem, and that is the point of this block existing rather
  # than being assumed: `docker` reads Dockerfiles only, so without these two
  # entries the postgres digest #93 just set would be the one pin in the system
  # that nothing ever lifts — the exact situation #93 was about.
  #
  # compose.dev.yaml is here too: check-compose rule 8 requires the two files
  # to name the same image byte for byte, so a bump that moved only one of them
  # would go red. They move together or not at all.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # #176. ADR 0007 pins the 3.13.x LTS line; 3.14 is a six-week release.
      # By name, not by "*": postgres 18.6 -> 18.7 is a minor we want.
      - dependency-name: "prom/prometheus"
        update-types: ["version-update:semver-minor"]
    commit-message: { prefix: chore }

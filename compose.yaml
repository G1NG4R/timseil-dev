# Production. Dokploy runs this file on the VPS; the only other thing that runs
# it is `make check-topology`, which runs it here to prove this phase's single
# claim — that `down -v && up` reproduces the whole state with no handwork.
#
# Six rules this file exists to keep, and each of them is a gate in
# tools/check-compose.sh rather than a sentence somebody has to remember:
#
#   1. No `build:`. Building on the VPS means the artefact you tested is not the
#      artefact that runs — and then the contract test, the SBOM and the
#      signature all describe an image nobody ever deployed. compose.dev.yaml is
#      the one file allowed to build.
#   2. No bind mount except the read-only ones under ./ops — and the docker
#      socket on alloy, which is this file's one exception and carries its
#      reasoning at the line itself. Dokploy's volume backups to S3 see named
#      volumes and nothing else, and a bind mount is data you find out you
#      cannot restore on the day you need it.
#   3. No `ports:` and no Traefik label for db, prometheus, loki or alloy. From
#      outside this host 22, 80 and 443 answer; nothing else does.
#   4. No `env_file:`. Every value arrives from the Dokploy UI as runtime
#      environment. A file on the host is a second home for secrets, a second
#      thing to rotate, and a file that has to exist before `up` — which is the
#      Handgriff this phase is defined by not needing.
#   5. api and web sit in the proxy network and in default; prometheus and loki
#      in the Grafana seam and in default; db, migrate, seed and alloy in
#      default alone. A service that names `networks:` joins ONLY those, so this
#      is the rule with the most misleading failure in the file: drop `default`
#      from the api and the database disappears, and it reads like a database
#      outage. Nothing of ours is in the proxy network that does not have to be
#      — that one is shared with every other app on the host.
#   6. dokploy-network is `external:` — Dokploy owns it. Without that word
#      compose does not fail; it creates its own, and Traefik is on neither.
#      `make require-network` makes a local stand-in so this file still runs on
#      a machine that is not the VPS.
#
# The chain is db → migrate → seed → api → web. FIVE services, not the four the
# build plan draws: the seed is idempotent and writes the curated content, so a
# corrected evidence line ships as a deploy instead of as handwork on the
# production database (issue #28, ADR 0013). ADR 0027 records the divergence as
# the plan being outrun rather than ignored.
#
# Beside the chain and depended on by no part of it: prometheus, loki and alloy.
# They measure the chain, and the site keeps serving when all three are gone —
# ADR 0007 puts Prometheus on the measuring side and Postgres on the serving
# side precisely so that this file has no arrow pointing back. F2, ADR 0039.
#
# Traefik is here as labels and nowhere else. The proxy itself belongs to
# Dokploy — one instance, not two, or they fight over 80 and 443 — and so do the
# entrypoint names, the certresolver, the TLS options and the metrics endpoint.
# What is Dokploy's is written down in docs/runbooks/dokploy.md rather than
# versioned here, because an upgrade that wipes it should leave a record of what
# it wiped. ADR 0028.

name: timseil

services:
  db:
    # A literal tag, not a variable and not a digest. stack.yaml reads this line
    # to put the PostgreSQL version on the page, and it reads the raw YAML rather
    # than the interpolated document — a `${POSTGRES_IMAGE:-…}` here would put a
    # variable name on the page. A digest would be worse: the manifest takes
    # everything after the last `:` as the version, so the page would show a
    # sha256. Pinning this one belongs to E2, together with the Dependabot rule
    # that would then have to bump it. ADR 0027.
    #
    # make check-compose refuses a drift between this tag and compose.dev.yaml's:
    # a page showing the development version is the exact class of error the
    # manifest exists to prevent (issue #28).
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      # `:?` here and pass-through below, and the split is a rule rather than a
      # mood: a variable gets `:?` only where an empty value fails SILENTLY or
      # names the wrong problem. These two qualify. POSTGRES_DB left empty
      # silently becomes the value of POSTGRES_USER, and POSTGRES_USER left empty
      # silently becomes `postgres` — either way you get a running cluster that
      # is quietly the wrong one, and the healthcheck below goes green against it.
      POSTGRES_DB: ${POSTGRES_DB:?set it in Dokploy — an empty value silently becomes POSTGRES_USER}
      POSTGRES_USER: ${POSTGRES_USER:?set it in Dokploy — an empty value silently becomes "postgres"}
      # No `:?`: the image refuses to initialise without it and says so in one
      # line. Restating that refusal here would be a second place for it to drift.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # scram-sha-256 from the first initdb on. Retrofitting an auth method onto
      # an existing cluster is the kind of chore nobody gets around to.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      # Read by the initdb script below, which is a shell file precisely because
      # only shell files in that directory see these. Both carry their own
      # `: "${VAR:?}"` in 10-roles.sh and abort initdb loudly, so no `:?` here.
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      # F3, and it reaches a cluster that already exists only through the psql
      # session in docs/runbooks/migrations.md — initdb does not run twice.
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:-}
      # POSTGRES_CREATE_TEST_DB is deliberately absent. 10-roles.sh creates
      # ${POSTGRES_DB}_test only when it is set, and only `make check-db` needs
      # that database. compose.dev.yaml sets it; this file must not.
    expose:
      - "5432"
    volumes:
      # The one bind mount in this file, and it is configuration, not data. The
      # named-volume rule protects what you would have to RESTORE; this script is
      # in git, git is its backup, and a named volume for it would have to be
      # populated by hand — a Handgriff, and one that drifts from the repo in
      # silence. `:ro`, and tools/check-compose.sh refuses every other host path.
      #
      # It runs ONCE, on the first start of an empty data directory, and creates
      # timseil_migrate and timseil_app. On an existing volume it does not run at
      # all, which is why a change here means the volume goes rather than the
      # container restarting. ADR 0011.
      - ./ops/postgres/initdb:/docker-entrypoint-initdb.d:ro
      # /var/lib/postgresql, NOT .../data. From image 18 on the data directory is
      # a major-version-specific subdirectory so pg_upgrade --link can work
      # without crossing a mount boundary; mounting .../data makes the container
      # refuse to start. The build plan's own snippet still shows the old path.
      - db-data:/var/lib/postgresql
    healthcheck:
      # Declared here and only here. The postgres image ships no HEALTHCHECK, so
      # unlike api and web there is nothing to inherit — and migrate waits on
      # this answer, so without it the schema would be applied against a cluster
      # that is still starting.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      # Covers initdb plus the roles script on a cold volume. Failures inside it
      # do not count, which is what stops a first deploy looking like an outage.
      start_period: 10s
    # Docker's default grace is 10s. The image's STOPSIGNAL is SIGINT — a fast
    # shutdown rather than the polite one — but a checkpoint on a busy disk is
    # not instant, and a database killed mid-checkpoint pays for it on the next
    # start.
    stop_grace_period: 30s
    security_opt:
      # Blocks GAINING privileges through setuid; it does not block dropping
      # them, which is what this entrypoint does when it steps down from root to
      # postgres. No `cap_drop` here on purpose: the entrypoint needs CHOWN,
      # SETUID, SETGID and friends to do that, and a wrong list bricks the
      # database. That list wants a test, and the test is an L2 item.
      - no-new-privileges:true
    # Docker's default /dev/shm is 64 MB. Postgres puts parallel-worker segments
    # there, and the failure reads like a Postgres bug while being a Docker
    # default: "could not resize shared memory segment".
    shm_size: 128mb
    deploy:
      resources:
        # shared_buffers is 128 MB by default and Postgres does NOT derive it
        # from this limit — a limit below it would OOM on the first large scan.
        # 128 MB + up to three autovacuum workers at 64 MB + ~25 backends at
        # ~8 MB is the shape of the worst case. 512M is the ceiling that turns a
        # runaway into an OOM kill instead of a swapping host, and a whole core
        # because a vacuum or an index build wants one.
        limits:
          cpus: "1.00"
          memory: 512M
        # reservations.cpus is a swarm scheduling hint and does nothing under
        # `docker compose up`, so it is not written down as a number that does
        # nothing. This one is real: it maps to Docker's soft memory limit. The
        # three reservations in this file sum to 480 MB, which is what build plan
        # ch. 10 budgets for this group once Traefik's ~100 MB is Dokploy's.
        # The limits are the blast radius; the reservations are the budget.
        reservations:
          memory: 256M

  # Applies the schema, then exits. An init container: everything downstream
  # waits for its exit code, not for a port.
  #
  # Same image as the api, a different verb. Three separately linked Go binaries
  # would be 32 MiB against the 20 MiB ceiling make check-images enforces, and
  # one binary carrying all three is 15 (ADR 0027). One image also keeps the
  # promise issue #28 rests on: the seed writes systems.stack from a manifest
  # embedded at build time, so rolling the image back rolls its stack claims back
  # with it. With one tag that is a mechanism; with three it is a convention.
  migrate:
    image: ghcr.io/g1ng4r/timseil-api:${IMAGE_TAG:?set IMAGE_TAG in Dokploy — the deploy pipeline sets it to sha-<short sha>}
    command: ["migrate", "up"]
    # Not a service. A failed migration must stop the deploy, not loop until the
    # log fills the disk.
    restart: "no"
    healthcheck:
      # Switched off, not restated. The image carries a HEALTHCHECK that dials
      # the server's /readyz — correct for the api, meaningless for a program
      # that applies eight files and exits, and `--wait` would sit waiting for a
      # port that was never going to open.
      disable: true
    environment:
      # timseil_migrate — DDL, and the api service below deliberately never sees
      # this variable. Giving the long-lived process DDL credentials would make
      # the role split decoration (ADR 0011); which binary the code sits in was
      # never what enforced it. No `:?`: the subcommand exits 1 naming this
      # variable, and service_completed_successfully turns that into a blocked
      # deploy rather than a half-started stack.
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # Writes the curated content: two systems, five modules, 22 tracks, 13 evidence
  # rows. No measurements — those come from the probe (F4). ADR 0013.
  #
  # It runs on EVERY deploy, and that is the feature rather than the cost: it is
  # idempotent, so a corrected evidence line ships as a deploy instead of as
  # handwork on the production database.
  seed:
    image: ghcr.io/g1ng4r/timseil-api:${IMAGE_TAG:?set IMAGE_TAG in Dokploy — the deploy pipeline sets it to sha-<short sha>}
    command: ["seed"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      # DATABASE_URL, not MIGRATE_DATABASE_URL. The seed is DML only, and running
      # it as the app role is how that is proven rather than asserted —
      # TestSeedNeedsNoSchemaPrivileges is the other half of the proof.
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  api:
    image: ghcr.io/g1ng4r/timseil-api:${IMAGE_TAG:?set IMAGE_TAG in Dokploy — the deploy pipeline sets it to sha-<short sha>}
    restart: unless-stopped

    # NO healthcheck block here, and its absence is the decision. The HEALTHCHECK
    # is in the image: `/api -healthcheck`, which dials the /readyz of the server
    # the same binary is running, because distroless has no shell to run wget in
    # (ADR 0026). Compose inherits it, and `depends_on: service_healthy` is
    # satisfied by an inherited one. Two versions of a healthcheck are one
    # version that drifts — tools/check-compose.sh refuses a second one here.

    # Still no `ports:`. Traefik reaches this over dokploy-network and nothing
    # else does — from outside the host, 22, 80 and 443 answer.
    #
    # THE READ API IS PUBLIC AND SITS ON THE SITE'S OWN HOST under /api (ADR
    # 0004). That means this rule also routes /api/internal/probe and
    # /api/internal/deploy: until L3 puts the second layer in front of them they
    # are reachable from outside and carry ONE defence, their token, where the
    # handbook (ch. 29) asks for two. L3 has to resolve #40 while it does that —
    # M3 wants that path to 404 from outside and F4's probe knocks on it from
    # outside. D3 does not decide it; D3 refuses to leave it unsaid.
    #
    # Three values here belong to Dokploy's static Traefik configuration and are
    # READ OFF THE VPS before this file is believed: the certresolver name, the
    # TLS entrypoint name, and whether that Traefik already redirects http to
    # https globally — if it does not, the redirect is ours to add. Step 1 of
    # docs/runbooks/dokploy.md is how to read all three. A guessed certresolver
    # is a certificate that never arrives.
    #
    # `priority` is explicit on both routers. Traefik orders by rule LENGTH when
    # nobody says otherwise, so this one would win today by accident and stop
    # winning the day somebody shortens the rule. An accident is not a decision.
    #
    # The router name carries a project prefix: Traefik belongs to Dokploy, and
    # a second app on this host would otherwise collide on `api`. ADR 0028.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.timseil-api.rule=(Host(`timseil.dev`) || Host(`www.timseil.dev`)) && PathPrefix(`/api`)
      - traefik.http.routers.timseil-api.entrypoints=websecure
      - traefik.http.routers.timseil-api.tls.certresolver=letsencrypt
      - traefik.http.routers.timseil-api.priority=100
      - traefik.http.routers.timseil-api.middlewares=timseil-www@docker,timseil-retry@docker
      - traefik.http.services.timseil-api.loadbalancer.server.port=8080

      # THE SAME TWO MIDDLEWARES ARE DEFINED AT `web`, WORD FOR WORD, AND THE
      # DOUBLING IS THE POINT — it is not a leftover and removing it is a bug.
      #
      # Traefik's docker provider reads middlewares off container labels. A
      # router that names one no container defines goes into ERROR, and the path
      # answers Traefik's own 404. Until now both of these lived at `web` alone
      # while THIS router named them: with web gone and api up — a failed web
      # deploy, a crash loop, an OOM kill — /api answers 404 rather than serving.
      # The failure would look like a routing problem and be a label.
      #
      # So the rule, and tools/check-compose.sh holds it: a service that NAMES a
      # middleware DEFINES it. Then the reference cannot dangle while the
      # container that makes it exists. The same check refuses two definitions of
      # one name that disagree — two versions of a middleware are worse than a
      # missing one, because Traefik picks one and does not say which.
      #
      # The `$$` is not a typo, here for the same reason it is not one below.
      - traefik.http.middlewares.timseil-www.redirectregex.regex=^https://www\.timseil\.dev/(.*)
      - traefik.http.middlewares.timseil-www.redirectregex.replacement=https://timseil.dev/$${1}
      - traefik.http.middlewares.timseil-www.redirectregex.permanent=true
      - traefik.http.middlewares.timseil-retry.retry.attempts=2
      - traefik.http.middlewares.timseil-retry.retry.initialinterval=100ms
      # THE READER FOR SHUTDOWN_DELAY, and without it that variable is a knob
      # with no effect. Traefik's docker provider drops a backend when the
      # container leaves the running state — it does not read /readyz unless it
      # is told to, and by the time a container has left, the request that was
      # already on its way has nowhere to land. On SIGTERM this answers 503
      # while still accepting, so the check below takes the backend out of the
      # pool first and the socket closes to an address nobody is using.
      #
      # One second, and a matching timeout. The pause on the other side is three
      # (api/internal/config), which is one interval plus one timeout plus a
      # second of margin — the two numbers are chosen against each other and
      # neither is a round number picked alone.
      #
      # /readyz and /healthz are exempt from the rate limiter for this: sixty
      # requests a minute all keyed on the proxy's own address would otherwise
      # spend half of RATE_LIMIT_RPM, and the 429 at the end of that reads to
      # Traefik as an unhealthy backend. internal/middleware.Except.
      - traefik.http.services.timseil-api.loadbalancer.healthcheck.path=/readyz
      - traefik.http.services.timseil-api.loadbalancer.healthcheck.interval=1s
      - traefik.http.services.timseil-api.loadbalancer.healthcheck.timeout=1s

    # Both, and the order does not matter but the presence of each does: a
    # service that names `networks:` joins ONLY those, so dropping `default`
    # here would take db away from the api and the failure would look like a
    # database outage. tools/check-compose.sh rule 11 refuses either half alone.
    networks: [default, dokploy-network]

    expose:
      # Documentation, and the number the Traefik label above has to name — the
      # two are held equal by check-compose rule 10, because Traefik guesses
      # wrong when a container offers more than one port and the symptom is a
      # timeout rather than an error. It matches listenAddr in cmd/api/main.go.
      - "8080"
    environment:
      # The app role. DML only — it cannot create or drop a table, which is what
      # keeps an SQL injection here from taking the schema with it. No `:?`:
      # config.Load names every missing variable at once (ADR 0014), and a `:?`
      # here would restate that refusal in a second place.
      DATABASE_URL: ${DATABASE_URL:-}

      # Every tunable passed through empty. An empty value means "use the default
      # in api/internal/config", so the defaults live in exactly one place and
      # this file cannot drift from them.
      LOG_LEVEL: ${LOG_LEVEL:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-}
      SHUTDOWN_GRACE: ${SHUTDOWN_GRACE:-}
      SHUTDOWN_DELAY: ${SHUTDOWN_DELAY:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-}
      DB_IDLE_TX_TIMEOUT: ${DB_IDLE_TX_TIMEOUT:-}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SITE_SYSTEM_SLUG: ${SITE_SYSTEM_SLUG:-}

      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_LOGIN: ${GITHUB_LOGIN:-}
      # `github` is the default and lives in api/internal/config, so this passes
      # through rather than restating it. `off` exists for a production image
      # being checked by hand without a credential: it switches the refresher
      # off, never the start and never the endpoint (ADR 0026 §4).
      CONTRIBUTIONS_TRANSPORT: ${CONTRIBUTIONS_TRANSPORT:-}

      # Passed through, NOT pinned — and this is the one line where this file
      # deliberately differs from compose.dev.yaml, which pins `log` because L1
      # comes after stage D. The code default is `smtp`. A production file that
      # quietly set `log` would answer every submission 202 and deliver nothing,
      # which is the worst failure this endpoint has, because it looks like
      # success from both ends.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-}

      CONTACT_IP_PEPPER: ${CONTACT_IP_PEPPER:-}
      INTERNAL_PROBE_TOKEN: ${INTERNAL_PROBE_TOKEN:-}
      INTERNAL_DEPLOY_TOKEN: ${INTERNAL_DEPLOY_TOKEN:-}

      # The outage-log replay (F4). Passed through; `github` is the default and
      # lives in api/internal/config. There is no token beside it — the branch is
      # public and the reader is unauthenticated on purpose.
      UPTIME_TRANSPORT: ${UPTIME_TRANSPORT:-}

      # The PromQL snapshot loop (F5). Passed through; `prometheus` is the
      # default and lives in api/internal/config. No URL beside it, and that is
      # the SSRF rule rather than an omission: the address is compiled into
      # api/internal/snapshots, and it is the ALIAS below rather than the
      # service name.
      SNAPSHOTS_TRANSPORT: ${SNAPSHOTS_TRANSPORT:-}

      # Empty in development because nothing forwards anything there. Here
      # Traefik does forward, and Dokploy sets this to the network it reaches the
      # api on. Believing X-Forwarded-For from anyone else would let a client
      # choose its own identity for the rate limiter. ADR 0015.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

      # Go's garbage collector sizes itself from the heap and knows nothing about
      # the cgroup, so without this the limit below is a kill rather than a
      # budget. 80 % of (256M limit − 16M tmpfs). THESE TWO NUMBERS MOVE
      # TOGETHER. GOMAXPROCS is not set: Go 1.26 reads the cgroup CPU quota.
      GOMEMLIMIT: 192MiB

    # Longer than SHUTDOWN_GRACE (20s), and that relationship is the whole point.
    # Docker's default is 10 seconds: with it the process would still be draining
    # politely when SIGKILL arrived, the shutdown tests would stay green, and
    # production would cut requests anyway. ADR 0014 says this file has to carry
    # the line because no Go test can see it. This is that line.
    stop_grace_period: 30s

    # Deferred from D1 to here, and proven there: the image runs read-only with
    # --cap-drop ALL and no-new-privileges against a real Postgres, including the
    # healthy → unhealthy → healthy transition when the database went away and
    # came back (ADR 0026).
    read_only: true
    tmpfs:
      # os.TempDir(). Sized, because an unsized tmpfs is a way to spend the
      # container's whole memory limit; noexec and nosuid because nothing here
      # should ever run out of /tmp.
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          memory: 64M

    depends_on:
      db:
        condition: service_healthy
      # The API must not come up against a database without a schema.
      migrate:
        condition: service_completed_successfully
      # And not against an empty one either. Without this a fresh deploy serves a
      # site with no systems and no tracks, and the empty state looks like a bug
      # in whatever changed last. Issue #28, ADR 0013.
      seed:
        condition: service_completed_successfully

  web:
    image: ghcr.io/g1ng4r/timseil-web:${IMAGE_TAG:?set IMAGE_TAG in Dokploy — the deploy pipeline sets it to sha-<short sha>}
    restart: unless-stopped

    # No healthcheck here either — web/Dockerfile carries one (busybox wget
    # against 127.0.0.1:3000), and one version of it is enough.

    # The same shape as the api's above, one priority lower: this rule catches
    # everything the api's PathPrefix did not.
    #
    # The www → apex redirect is defined here AND at the api, word for word.
    #
    # "It does not need repeating on the api" is what this comment said until
    # E5b, and it was true only while nothing ever ran without web. The docker
    # provider does register a middleware globally — but only for as long as a
    # container carrying the label exists, and a router that names a middleware
    # nobody defines goes into error and answers 404. The doubling is deliberate
    # and tools/check-compose.sh holds it; the reasoning is written out once, at
    # the api.
    #
    # One canonical URL either way: two would leave G5 repairing them with
    # rel=canonical, and M6 does the same thing later for timseil.com.
    #
    # The $$ is not a typo. Compose interpolates $ and would eat $1 before
    # Traefik ever sees it; $$ reaches the label as a single $.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.timseil-web.rule=Host(`timseil.dev`) || Host(`www.timseil.dev`)
      - traefik.http.routers.timseil-web.entrypoints=websecure
      - traefik.http.routers.timseil-web.tls.certresolver=letsencrypt
      - traefik.http.routers.timseil-web.priority=10
      - traefik.http.routers.timseil-web.middlewares=timseil-www@docker,timseil-retry@docker
      - traefik.http.services.timseil-web.loadbalancer.server.port=3000
      # The same mechanism as the api's above, against web/app/healthz. NOT
      # against `/`: a check every second on the homepage is a full render every
      # second, and from stage H that stops being free.
      #
      # The image's own HEALTHCHECK asked `/` until F1b, and the two questions
      # were worth keeping apart: Docker's is "does this application work", which
      # is what `--wait` needs before the rollout moves on, and Traefik's is
      # "should I send this container traffic", which has to say no three seconds
      # before the answer to the first one changes.
      #
      # They are on the same path now, and the reason is upstairs in this file:
      # `/` fetches the api since F1b, and step 3 of a rollout has the api
      # briefly gone. A Docker probe that renders would make web unhealthy
      # because the api is — and `--wait` would sit there waiting for a container
      # to fix something that is not its to fix. The two questions still differ;
      # what changed is that only one of them can be asked without a second
      # container answering.
      - traefik.http.services.timseil-web.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.timseil-web.loadbalancer.healthcheck.interval=1s
      - traefik.http.services.timseil-web.loadbalancer.healthcheck.timeout=1s
      - traefik.http.middlewares.timseil-www.redirectregex.regex=^https://www\.timseil\.dev/(.*)
      - traefik.http.middlewares.timseil-www.redirectregex.replacement=https://timseil.dev/$${1}
      - traefik.http.middlewares.timseil-www.redirectregex.permanent=true

      # THE ONE THING THAT COVERS THE SWAP, and it is three lines rather than a
      # knob in the application. During a rollout Traefik has two backends for
      # each service — the container being replaced and its twin from
      # compose.rollout.yaml — and the one failure left after E5b's lab runs was
      # a single request landing on the socket of a container that had just
      # stopped accepting. That is a connection error, which is precisely and
      # only what `retry` retries: the request is forwarded again, round-robin
      # moves on, and the other backend answers it.
      #
      # attempts=2, not more. With two backends a second attempt has already
      # asked the other one; a third would ask the first again. A number picked
      # to match the topology rather than to sound generous.
      #
      # It does NOT retry a 5xx, and that is the point rather than a limitation:
      # a 502 from a healthy backend is an answer, and replaying a request that
      # reached the application is how one submitted contact form becomes two.
      #
      # Defined here once, like timseil-www above, and referenced by both
      # routers — the docker provider registers middlewares globally.
      - traefik.http.middlewares.timseil-retry.retry.attempts=2
      - traefik.http.middlewares.timseil-retry.retry.initialinterval=100ms

      # The HTTP entrypoint, because Dokploy's Traefik has no global redirect.
      # Measured on the host rather than assumed: a request to port 80 answers
      # 404, and an entrypoint-level `http.redirections` would answer 301
      # whether or not a router matched. There is a `redirect-to-https`
      # middleware in Dokploy's dynamic/middlewares.yml, but it is attached per
      # router by hand — nothing attaches it to ours.
      #
      # ONE router covers both services: redirectscheme keeps the path, so
      # /api/... arrives at https intact and the api needs no second router.
      #
      # Priority 1 so it can never shadow anything. Traefik registers its own
      # ACME challenge handler above user routers by construction, so the
      # certificate stays renewable over httpChallenge — which is the entrypoint
      # this router now also sits on.
      #
      # The middleware is defined HERE rather than borrowed as
      # redirect-to-https@file: what the host holds and this repo does not
      # version is gone after the next Dokploy upgrade, and then port 80 goes
      # quiet again without anything in this file changing.
      - traefik.http.routers.timseil-http.rule=Host(`timseil.dev`) || Host(`www.timseil.dev`)
      - traefik.http.routers.timseil-http.entrypoints=web
      - traefik.http.routers.timseil-http.priority=1
      - traefik.http.routers.timseil-http.middlewares=timseil-to-https@docker
      - traefik.http.middlewares.timseil-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.timseil-to-https.redirectscheme.permanent=true

    networks: [default, dokploy-network]

    expose:
      - "3000"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      # The api's variable, not a second one with WEB_ in front of it. One knob
      # with one meaning, the same way SHUTDOWN_DELAY is shared below — and a
      # web-only name would be invisible to tools/check-env.sh, which derives
      # what must exist from api/internal/config/config.go.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A site whose argument is "everything here is checkable" does not ship a
      # build tool that reports home in the background. It is also what keeps the
      # read-only rootfs working: telemetry is the thing that would try to write
      # into $HOME, which is not writable here.
      NEXT_TELEMETRY_DISABLED: "1"
      # The same pause as the api's, and the same variable: one number,
      # one meaning, both containers. instrumentation.ts reads it.
      SHUTDOWN_DELAY: ${SHUTDOWN_DELAY:-}
      # Node sizes its default old-space from TOTAL SYSTEM MEMORY, not from the
      # cgroup — on this 12 GB host it would pick well over 2 GB and then be killed
      # at the 512M below. This line is not tuning; it is the difference between
      # a container that runs and one that is OOM-killed under load.
      NODE_OPTIONS: --max-old-space-size=320

    # Read-only, and it needs two writable paths where the api needed one.
    # .next/cache is where next/image writes optimised images and where the fetch
    # cache lives; D1 found that the image cannot run read-only without it.
    #
    # tmpfs and not a named volume, for three reasons. A volume would be backed
    # up to S3 nightly, which is paying to preserve a cache. Disk is the platter
    # Postgres writes to and RAM is not. And a cache that SURVIVES an image
    # change is exactly the "the page shows last week's number" failure this site
    # exists to argue against — tmpfs dies with the container, which is the right
    # lifetime for something keyed to a build. The 96M is counted inside the
    # 512M limit below.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

    # Next's server handles SIGTERM. 15s is room for an in-flight render rather
    # than a number anyone measured, and it is said out loud that it is not one.
    stop_grace_period: 15s

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 160M

    depends_on:
      # Healthy, not merely started. Waiting for a container to exist is not the
      # same claim as waiting for one that can answer.
      api:
        condition: service_healthy
  # ---------------------------------------------------------- observability
  #
  # Three services, and nothing in this file depends on them. That is the
  # property, not an omission: ADR 0007 puts Prometheus on the measuring side
  # and Postgres on the serving side, and F5's acceptance criterion is that
  # stopping Prometheus leaves the page showing its last honest value instead of
  # breaking. A depends_on here would trade that away for a tidier graph.
  #
  # None of the three is reachable from outside this host. No ports, no Traefik
  # label, and check-compose rule 1 has named all three since D2 — the names sat
  # in that regex for eight phases before anything answered to them.
  #
  # Grafana is NOT here. There is already one on this machine, in a stack that
  # is not ours, and the build plan's own words are "bestehende Grafana-Instanz
  # einbinden". What is ours is the data and the limits on it; the interface can
  # be borrowed. observability-network below is how the borrowing works.
  # ADR 0039.

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # BOTH, and the pairing is the whole point of this phase. Time alone does
      # not help: an error loop fills gigabytes in hours and the 7-day rule
      # applies in 7 days. Prometheus can do what Loki cannot — bound its own
      # disk by size — so here the ceiling is a flag rather than three layers of
      # rate limit. ops/loki/loki.yaml explains the asymmetry.
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      # Explicit, because the default binds every interface anyway and a reader
      # should see which port the expose: below is about.
      - --web.listen-address=0.0.0.0:9090
      # --web.enable-lifecycle is deliberately ABSENT rather than set to false.
      # It defaults off, and a reload endpoint on a service with no
      # authentication is a lever for anything that reaches this network.
    # Long form for one reason: the alias. `prometheus` is not ours to claim on a
    # shared external network — this host already runs one under that name.
    #
    # When a name exists on several of a reader's networks, Docker answers from
    # the network whose NAME SORTS FIRST. Measured 2026-08-23, because the three
    # plausible guesses are all wrong: not attachment order (both orders gave
    # the same answer), not creation order, not subnet order — the decisive run
    # had the winner created second and holding the higher subnet, and it still
    # won on its name alone. `monitoring` sorts before `observability-network`,
    # so the neighbouring Prometheus would answer for both of them.
    #
    # Compose still adds the service name here and that cannot be switched off;
    # what we can do is publish a name that collides with nobody and point the
    # Grafana datasource at it. The failure this avoids is not a broken
    # datasource — it is a working one in front of the wrong server, which reads
    # as "our scrape is dead" instead of "wrong host". And the alias does not
    # depend on how names happen to sort, which the fix would otherwise inherit.
    networks:
      # The alias is on BOTH networks, and the second one is for a reader inside
      # this stack rather than outside it. The api sits on the default network
      # and on dokploy-network; Docker answers a name that exists on several of
      # a reader's networks from the network whose NAME SORTS FIRST, and
      # `dokploy-network` sorts ahead of `<project>_default`. That network is
      # shared with every other app on this host, so the day one of them
      # publishes a container called `prometheus`, `http://prometheus:9090`
      # would answer from THEIRS — and internal/snapshots would write a
      # stranger's latency into a page that says it measured itself. Green,
      # plausible, about the wrong system. `timseil-prometheus` collides with
      # nobody, and the Go side asks for it by name. ADR 0041 §4.
      default:
        aliases:
          - timseil-prometheus
      observability-network:
        aliases:
          - timseil-prometheus
    expose:
      - "9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # F3. A directory rather than a file, because rule_files takes a glob and
      # a second group later should not need a second line here. Read-only like
      # its neighbour: this container may evaluate the rules, never rewrite them.
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    environment:
      # 80 % of the 512M limit, the same arithmetic as the api's — Go's GC sizes
      # itself from the heap and cannot see the cgroup, so without this the
      # limit below is a kill rather than a budget. ADR 0027 §3a.
      GOMEMLIMIT: 400MiB
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        # Anchored on a measurement rather than a feeling: the Prometheus
        # already running on this machine sits at 84 MiB with more targets than
        # these three. 512M is the blast radius for a query that walks seven
        # days of series; 192M is the budget. Build plan ch. 10 gives the group
        # "Alloy · Prometheus · Loki · Grafana" ~800 MB, and Grafana's share is
        # already spent by the neighbouring stack.
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 192M

  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
    # No collision for this name today — and the alias is here anyway. The
    # neighbouring stack could add a loki tomorrow without telling us, and
    # whether it would win is decided by a string comparison between two network
    # names, which is not a thing to leave a datasource resting on. See
    # prometheus above. A name we own is cheaper than noticing.
    networks:
      default:
      observability-network:
        aliases:
          - timseil-loki
    expose:
      - "3100"
    volumes:
      - ./ops/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    environment:
      GOMEMLIMIT: 400MiB
    # NO healthcheck, and it is the image that decides that rather than us. This
    # one carries no shell and no http client — `docker run --entrypoint sh` on
    # it fails with "executable file not found", which is the right shape for a
    # log store and the wrong shape for a probe. Writing one anyway is how you
    # get a container that is permanently unhealthy while answering every
    # request, which is what the first run of this file did.
    #
    # Readiness is asserted from OUTSIDE instead, where there is a client:
    # prometheus scrapes loki, so `up{job="loki"}` is the signal, and
    # tools/check-observability.sh reads it. Nothing here depends on loki, so no
    # start order rests on the answer either.
    read_only: true
    tmpfs:
      # Compaction and the index writer use os.TempDir(). Sized, noexec, nosuid
      # — the same shape as the api's, and for the same reason: an unsized tmpfs
      # is a way to spend the container's whole memory limit.
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 192M

  alloy:
    image: grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
    restart: unless-stopped
    command:
      - run
      # The default HTTP listener is loopback-only, so without this Prometheus
      # scrapes nothing and the collector is the one thing in the stack nobody
      # can see. check-compose rule 10 does not apply here — no Traefik router
      # names this port — so the pairing with expose: below is held by nothing
      # but this comment and tools/check-observability.sh.
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # No networks: key. Alloy writes inward and nobody outside this stack asks
    # it anything — Prometheus scrapes it over the default network like any
    # other service. Putting it in observability-network would widen its reach
    # for no reader.
    #
    # No healthcheck either, and for loki's reason one step further: this image
    # has a shell but no http client. The scrape of :12345 is the liveness
    # statement, and it is a better one — a collector that answers a probe while
    # forwarding nothing is exactly the failure a probe would miss.
    expose:
      - "12345"
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # THE ONE SOCKET IN THIS FILE, and the only host path here that is not
      # ./ops. The daemon owns the container stdout streams; there is no other
      # way to read them. Read-only narrows it and does not make it safe — the
      # docker API is root on this machine, and ADR 0039 §3 says that out loud
      # instead of implying otherwise. tools/check-compose.sh allows this exact
      # string on this one service and refuses every other shape of it, and
      # tools/selftest.sh proves all three refusals.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Which containers are ours. It cannot be the literal `timseil`: Dokploy
      # runs compose with its own `-p <appName>` and writes COMPOSE_PROJECT_NAME
      # into the .env it generates, both of which outrank `name:` at the top of
      # this file — the same mechanism that made db-data need a pinned name.
      # ops/alloy/config.alloy filters on this value, and a wrong one is silent:
      # zero targets, an empty Loki, a green stack.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-timseil}
      GOMEMLIMIT: 200MiB
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    # No cap_drop: ALL. Reading /var/run/docker.sock needs either root or the
    # host's docker group, and that group's numeric id is a fact about this
    # machine that does not belong in this repository. The image's default user
    # is root, no-new-privileges is set, the root filesystem is read-only, and
    # the honest sentence is that this container is as privileged as the socket
    # it holds — which is why it holds nothing else.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 96M

  # ------------------------------------------------------------- F3 exporters
  #
  # Two more services on the measuring side, and the same three properties as
  # the three above: no ports, no Traefik label, no depends_on. The last one is
  # deliberate for postgres-exporter in particular — it reads the database, so
  # the tempting line is `depends_on: db`. But then a database that is slow to
  # come up delays a container whose whole job is to REPORT that, and ADR 0007
  # keeps the measuring side out of the serving side's critical path. Without
  # the dependency the failure is legible instead: up{job="postgres"} goes to 0.

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    restart: unless-stopped
    # distroless, and it is not a preference. This container reads the host's
    # root filesystem; the variant without a shell is the one where a way in
    # buys the least. Our own images have been shell-free since D1 for the same
    # sentence (make check-images), and a borrowed image gets the same standard.
    command:
      # The three paths below are where the mounts land. Without them the
      # collectors read the CONTAINER's /proc and /sys and report a machine that
      # does not exist — a green job, plausible numbers, and none of them the
      # host's. That is the failure this service exists to avoid, so the flags
      # and the mounts are written next to each other on purpose.
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Everything Docker itself mounts is noise on a one-host stack: overlay
      # layers come and go with every deploy and each one is a filesystem series.
      # What is left is the real disk, which is the one F10's 70 % alert reads.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|securityfs|sysfs|tracefs)$$
      - --web.listen-address=0.0.0.0:9100
    expose:
      - "9100"
    volumes:
      # THE SECOND EXCEPTION IN THIS FILE, and it is as narrow as the first.
      # tools/check-compose.sh rule 3 allows only read-only paths under ./ops,
      # plus the docker socket on alloy (ADR 0039 §3). These three are the other
      # allowance: three literal paths, read-only, on this one service, and
      # tools/selftest.sh proves that a fourth path or the same path on another
      # service is still refused.
      #
      # Why there is no narrower version: the numbers F10's disk alert needs are
      # the host's, and /proc and /sys are how the kernel publishes them. A
      # node-exporter without them is a node-exporter describing its own
      # container. ADR 0040 §2.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        # The smallest budget in the file, and it is still generous: this
        # process holds no series, it renders them on request. The ceiling is
        # there so that a runaway collector is a restart rather than a host
        # under memory pressure — the same reasoning ADR 0027 §2 applies to
        # every other service here.
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    command:
      - --web.listen-address=0.0.0.0:9187
    expose:
      - "9187"
    environment:
      # A THIRD ROLE, and the split is the same one ADR 0011 made for the first
      # two. timseil_migrate owns the schema and does DDL; timseil_app may only
      # read and write rows. Reading pg_stat_* is neither, and pg_stat_activity
      # in particular shows a non-privileged role its own queries and nobody
      # else's — so an exporter running as timseil_app would report a database
      # with almost nothing happening in it. timseil_metrics carries pg_monitor
      # and nothing besides. ADR 0040 §3.
      #
      # No `:?`. The exporter names a missing DSN in one line on startup and the
      # job goes to 0 — restating that here would be a second place for the
      # message to drift. The variable is set in Dokploy, like every other one.
      DATA_SOURCE_NAME: ${METRICS_DATABASE_URL:-}
      GOMEMLIMIT: 100MiB
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 48M


volumes:
  # Four volumes now, and only the first one holds anything a restore would have
  # to bring back. Named, all of them, because Dokploy's S3 volume backups see
  # named volumes and nothing else. api and web still write to tmpfs and to
  # nothing that outlives them, which is the property that makes an image
  # rollback a complete rollback.
  db-data:
    # Pinned, because `name: timseil` at the top of this file does not survive
    # the deploy. Dokploy starts compose with its own `-p <appName>` and writes
    # COMPOSE_PROJECT_NAME into the .env it generates; both outrank the `name:`
    # field, and an unpinned volume inherits the generated suffix instead. On
    # 2026-08-18 that produced timseildev-timseildev-eixe3r_db-data.
    #
    # Why that matters more than tidiness: the suffix changes if the app is ever
    # recreated in Dokploy. A changed name is a DIFFERENT, empty volume, with the
    # old one left beside it as "unused" — in reach of the one manual button that
    # runs `docker volume prune --all --force`. Pinning the name makes the
    # database independent of what Dokploy calls the project.
    name: timseil_db-data

  # The three observability volumes carry the same pinned-name treatment for the
  # same reason: a recreated Dokploy app would otherwise leave the old ones
  # beside the new, unused and in reach of the prune button.
  #
  # WHY THEY ARE VOLUMES AND NOT BIND MOUNTS is the ordinary rule. Why they are
  # SEPARATE volumes is this phase's reason: build plan F2 asks for "eigene
  # Volumes, damit die Größe messbar bleibt" — one `du -sh` per store, so the
  # question "which of these is eating the disk" has an answer that is not an
  # estimate.
  #
  # Backing them up is a different question and the answer is no: metrics and
  # logs are the record of a machine, and restoring last week's record onto this
  # week's machine would produce a history that never happened. L6 backs up the
  # database. These three are allowed to be lost.
  prom-data:
    name: timseil_prom-data
  loki-data:
    name: timseil_loki-data
  alloy-data:
    name: timseil_alloy-data

networks:
  # Traefik's network, and Dokploy owns it. `external: true` says two things at
  # once: nothing here creates it, and nothing here may assume its shape.
  #
  # Leave the `external:` off and compose does NOT fail — it quietly creates
  # `timseil_dokploy-network`, a real and healthy network that Traefik is not
  # on. The stack comes up green and is invisible to the proxy. That is the
  # failure this declaration exists to make impossible, and check-compose
  # rule 12 refuses the file without it.
  #
  # The internal network stays the implicit `default`. It is written out in the
  # two service lists rather than left to inference, because a reader who sees
  # two entries asks why and a reader who sees one does not.
  #
  # Not `internal: true` on that one either: the api talks to GitHub's GraphQL
  # API and to OVH's SMTP, so it needs egress.
  #
  # On a machine that is not the VPS this network does not exist and compose
  # refuses to start. `make require-network` creates an empty stand-in so the
  # same file still runs here — ADR 0028.
  dokploy-network:
    external: true

  # The seam to the Grafana that already runs on this machine, and the whole
  # reason this stack needs a third network.
  #
  # That Grafana belongs to another compose app. Docker resolves names per
  # network, so from where it stands `prometheus:9090` and `loki:3100` do not
  # exist — our default network is ours alone, which is exactly why db lives in
  # it. The two ways out of that were putting our stores into dokploy-network,
  # which is shared with every app on the host and is what check-compose rule 1
  # exists to prevent, or a network that means one thing and is joined on
  # purpose. This is the second.
  #
  # `external:` for the same two reasons as above: nothing here creates it, and
  # nothing here assumes its shape. The other half of the wiring is one switch
  # in the neighbouring app's own Dokploy settings — docs/runbooks/observability.md
  # has the click path. Doing it that way instead of `docker network connect` on
  # the host means it survives that app's next redeploy.
  #
  # `make require-network` creates a stand-in for this one too, so the file
  # still runs on a machine that is not the VPS. ADR 0039 §2.
  observability-network:
    external: true

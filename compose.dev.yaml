# Local development. This is the ONE compose file allowed to carry `build:` —
# compose.yaml next door may not, because building on the VPS would mean the
# artefact you tested is not the artefact that runs.
#
# Same order as production: db → migrate → seed → api → web, each waiting for the
# one below it. The difference is what runs: here `go run` against a bind mount,
# there the two images out of GHCR.
# Postgres has no `ports:` here either. Reach it with
#
#     docker compose -f compose.dev.yaml exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
#
# Values come from .env — copy .env.example first.

name: timseil-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env — copy .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env — copy .env.example}
      # scram-sha-256 from the first initdb on. Retrofitting an auth method
      # onto an existing cluster is the kind of chore nobody gets around to.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      # Read by the initdb script below, which is a shell file precisely because
      # only shell files in that directory see these.
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?set it in .env — copy .env.example}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set it in .env — copy .env.example}
      # The throwaway database `make check-db` cycles against. Opt-in, and this
      # is the file that opts in: production must not carry a second database
      # nobody uses, and a default that creates one would put it there the day
      # somebody forgets the variable. The safe direction of a default is the
      # whole decision — ADR 0026 §4 made the same call for CONTRIBUTIONS_TRANSPORT.
      POSTGRES_CREATE_TEST_DB: "1"
    expose:
      - "5432"
    volumes:
      # Runs ONCE, on the very first start of an empty data directory. It
      # creates timseil_migrate and timseil_app and the test database. On an
      # existing volume it does not run at all — that is why a change here means
      # `make dev-reset` and not just a restart. ADR 0011.
      - ./ops/postgres/initdb:/docker-entrypoint-initdb.d:ro
      # Named volume, not a bind mount: Dokploy's volume backups only see named
      # volumes, and dev should not diverge from that on the storage question.
      #
      # /var/lib/postgresql, NOT .../data. From image 18 on the data directory
      # is a major-version-specific subdirectory, so that pg_upgrade --link can
      # work without crossing a mount boundary. Mounting .../data makes the
      # container refuse to start. The same path has to be used in D2.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # Applies the schema. Same order as compose.yaml, where this is an init
  # container instead of a compose-run target.
  #
  # It carries MIGRATE_DATABASE_URL and the api service does not: giving the
  # long-lived API process DDL credentials would undo the very separation this
  # phase builds. Postgres publishes no port, so this is also the only way to
  # reach the database at all — goose from the host cannot.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?set it in .env — copy .env.example}
      # For `make check-db`, which reuses this service with a different
      # entrypoint. Both point at the throwaway database, never at timseil.
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:?set it in .env — copy .env.example}
      TEST_APP_DATABASE_URL: ${TEST_APP_DATABASE_URL:?set it in .env — copy .env.example}
    # `./cmd/api migrate`, not `./cmd/migrate`: D2 folded the migration and the
    # seed into the one binary the production image already ships, because three
    # separately linked Go binaries cost 32 MiB against a 20 MiB ceiling (ADR
    # 0027). The verb sits in the entrypoint rather than the command so that
    # `make migrate-status` and `make migrate-create` can keep passing nothing
    # but their own argument.
    entrypoint: ["go", "run", "./cmd/api", "migrate"]
    command: ["up"]
    restart: "no"
    volumes:
      - ./api:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  # Writes the curated content: two systems, five modules, 22 tracks, 13 evidence
  # rows. No measurements — those come from the probe (C7, F4).
  #
  # It carries DATABASE_URL, not MIGRATE_DATABASE_URL: the seed is DML only, and
  # running it as the app role is how that is proven rather than asserted.
  seed:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?set it in .env — copy .env.example}
    # Same binary as migrate and as api, a different verb and a different role.
    entrypoint: ["go", "run", "./cmd/api", "seed"]
    restart: "no"
    volumes:
      - ./api:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      # The app role. DML only — it cannot create or drop a table, which is what
      # makes an SQL injection here unable to take the schema with it.
      DATABASE_URL: ${DATABASE_URL:?set it in .env — copy .env.example}

      # The tunables. Passed through empty when .env does not set them, and an
      # empty value means "use the default in api/internal/config" — so the
      # defaults live in exactly one place and this file cannot drift from them.
      LOG_LEVEL: ${LOG_LEVEL:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-}
      SHUTDOWN_GRACE: ${SHUTDOWN_GRACE:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-}
      DB_IDLE_TX_TIMEOUT: ${DB_IDLE_TX_TIMEOUT:-}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SITE_SYSTEM_SLUG: ${SITE_SYSTEM_SLUG:-}

      # The contribution graph. There is no default for the token and the api
      # refuses to start without one — but the refusal belongs to the process,
      # not to this file.
      #
      # `:?` was the obvious choice and it is wrong here. Compose interpolates
      # the whole document before it does anything, so a `:?` on a variable only
      # the api needs makes `make check-db` and `make migrate` fail too — two
      # targets that never start this service and have nothing to do with
      # GitHub. The error even looks like a broken migration. Passed through
      # empty instead, and config.Load says the useful sentence.
      #
      # Runtime environment, never a build arg: this file's `build:` block above
      # passes no secrets, and a token in an image layer stays in that layer
      # after it is rotated.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_LOGIN: ${GITHUB_LOGIN:-}

      # The off switch for the refresher, and the counterpart to MAIL_TRANSPORT
      # below. `github` is the default and lives in api/internal/config, so this
      # line passes through and does not restate it — a default written in two
      # places is a default that drifts.
      #
      # Set CONTRIBUTIONS_TRANSPORT=off in .env to start the api without a real
      # token. Nothing else changes: the endpoint still reads the cached row and
      # never invents a calendar to fill the gap.
      CONTRIBUTIONS_TRANSPORT: ${CONTRIBUTIONS_TRANSPORT:-}

      # The contact form. `log` rather than `smtp`, and that is the one value in
      # this block chosen by the file rather than passed through. At C6 the
      # reason was that the OVH mailbox and the DNS records did not exist yet;
      # since L1 they do, and the reason is a different one: a dev stack must
      # not send as the production account, on the domain whose reputation L1
      # built. The log transport builds the message in full — same Build, same
      # refusals, same bytes — and writes it to a log line instead of a socket,
      # so `make dev` works and you can read the finished envelope.
      #
      # Overridable, so that a machine with real credentials can point at OVH
      # without editing this file.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      # Same `:-` as GITHUB_TOKEN above, and for the same reason: a `:?` here
      # would stop `make migrate` and `make check-db`, neither of which starts
      # this service.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-}

      # Required whatever the transport — the api will not start without it, and
      # the refusal belongs to config.Load, not here. `openssl rand -hex 32`.
      CONTACT_IP_PEPPER: ${CONTACT_IP_PEPPER:-}

      # The two internal bearer tokens. Same `:-` as above and for the same
      # reason: the api will not start without them, and the refusal belongs to
      # config.Load. `openssl rand -hex 32`, once per variable.
      INTERNAL_PROBE_TOKEN: ${INTERNAL_PROBE_TOKEN:-}
      INTERNAL_DEPLOY_TOKEN: ${INTERNAL_DEPLOY_TOKEN:-}

      # Empty here, and that is not an oversight.
      #
      # In development nothing forwards anything: a request from your machine
      # arrives through docker's port mapping, so the peer is the bridge gateway
      # doing NAT — not a proxy that added an X-Forwarded-For. Listing the bridge
      # range would mean believing a header nobody sets, and the API would then
      # decline to rate limit anything and say so once a minute in the log.
      #
      # Production is the other case: Traefik does forward, and Dokploy sets this
      # to the network Traefik reaches the api on. ADR 0015.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      # 127.0.0.1 on purpose: convenient for curl, invisible to the network.
      - "127.0.0.1:${API_PORT:-8080}:8080"

    # Longer than SHUTDOWN_GRACE, and that relationship is the whole point.
    # Docker's default is 10 seconds: with it, the process would still be
    # draining politely when SIGKILL arrived, the shutdown tests would stay
    # green, and production would cut requests anyway. compose.yaml repeats it.
    stop_grace_period: 30s

    healthcheck:
      # wget is busybox's, from the alpine base. The production image is
      # distroless — no shell, no wget — so it answers its own healthcheck with
      # `/api -healthcheck` (ADR 0026). That one lives in the image, which is why
      # compose.yaml declares no healthcheck for api or web at all.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      # air compiles the binary on the first start, and a cold module cache
      # makes that slow. Failing the healthcheck while it compiles would be a
      # false alarm on every fresh clone.
      start_period: 60s
    volumes:
      - ./api:/app
      # air's build output, on a volume rather than in the bind mount. The
      # container runs as root, so anything it writes into ./api lands on the
      # host owned by root — and then `rm -rf` from your own account fails on
      # your own working tree.
      - api-tmp:/app/tmp
      # Caches as named volumes, or every restart re-downloads the module graph
      # and recompiles the world.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      # The API must not come up against a database without a schema. This is
      # also what makes `make dev` from an empty volume produce a working stack
      # in one command.
      migrate:
        condition: service_completed_successfully
      # And not against an empty one either: without this, `make dev` from a
      # fresh volume serves a site with no systems and no tracks, and the empty
      # state would look like a bug in whatever you were working on.
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      # A site whose argument is "everything here is checkable" does not ship a
      # build tool that reports home in the background.
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      # Anonymous volume, and it has to come after the bind mount: without it
      # the mount hides the node_modules the image installed and next dev dies
      # on the first import.
      - /app/node_modules
      # Same reason as api-tmp: root-owned .next in your working tree is a
      # directory you cannot delete without docker's help.
      - web-next:/app/.next
    depends_on:
      # Healthy, not merely started. The header of this file says every stage
      # waits for the one below it; until the api had a healthcheck, this one
      # could only wait for a container to exist, which is not the same claim.
      api:
        condition: service_healthy

volumes:
  db-data:
  api-tmp:
  go-mod-cache:
  go-build-cache:
  web-next:
